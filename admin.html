<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo Hunt BD — Admin</title><link rel="stylesheet" href="./styles.css"></head><body><main class="section"><div class="admin-nav"><div><span class="eyebrow">ADMIN CONTROL</span><h1>Photo Hunt BD</h1></div><a class="btn secondary" href="./index.html">← Main site</a></div><div id="adminRoot"><div class="empty">Admin login checking…</div></div></main><script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
const $=s=>document.querySelector(s);const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));let sb=null,user=null,profile=null;
async function start(){const r=await fetch('/api/config');const c=await r.json();if(!c.supabaseUrl||!c.supabasePublishableKey){$('#adminRoot').innerHTML='<div class="mission"><h3>Supabase config missing</h3><p>Render environment variables check করুন।</p></div>';return;}sb=createClient(c.supabaseUrl,c.supabasePublishableKey);const {data:{session}}=await sb.auth.getSession();if(!session){showLogin();return;}user=session.user;await load();}
function showLogin(){ $('#adminRoot').innerHTML='<div class="modal-card" style="margin:auto"><h2>Admin Login</h2><p class="sub">Admin account দিয়ে login করুন।</p><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button class="btn primary full" id="login">Login</button><div id="msg" class="status"></div></div>';$('#login').onclick=async()=>{const {data,error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#pass').value});if(error){$('#msg').textContent=error.message;return;}user=data.user;await load();};}
async function load(){const {data:p}=await sb.from('profiles').select('*').eq('id',user.id).single();profile=p;if(!p||p.role!=='admin'){$('#adminRoot').innerHTML='<div class="mission"><h3>Admin access নেই</h3><p>প্রথমে Supabase SQL Editor-এ আপনার profile-কে admin করুন:</p><code>update profiles set role = \'admin\' where id = \'YOUR-USER-UUID\';</code></div>';return;}render();}
async function render(){const {data:subs}=await sb.from('submissions').select('*').order('created_at',{ascending:false}).limit(100);const {data:missions}=await sb.from('missions').select('*').order('created_at',{ascending:false});$('#adminRoot').innerHTML=`<div class="chips"><span class="chip">👤 ${esc(profile.username)}</span><span class="chip">Pending: ${(subs||[]).filter(x=>x.status==='pending').length}</span><span class="chip">Missions: ${(missions||[]).length}</span></div><section class="mission"><h2>Create Mission</h2><div class="admin-form"><input id="mt" placeholder="Mission title"><input id="mx" type="number" value="100" placeholder="XP"><textarea id="md" placeholder="Description"></textarea><input id="mdiv" placeholder="Division"><input id="mdis" placeholder="District"><input id="mup" placeholder="Upazila"><input id="mun" placeholder="Union/Ward"><input id="mlat" type="number" step="any" placeholder="Latitude"><input id="mlng" type="number" step="any" placeholder="Longitude"><input id="mrad" type="number" value="150" placeholder="Radius metres"><button class="btn primary full-field" id="create">Create mission</button></div><div id="createMsg" class="status"></div></section><section class="mission"><h2>Submissions</h2><div style="overflow:auto"><table class="admin-table"><thead><tr><th>Photo</th><th>Explorer</th><th>Location</th><th>GPS</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section>`;renderRows(subs||[]);$('#create').onclick=createMission;}
async function renderRows(subs){const ids=[...new Set(subs.map(s=>s.user_id))];let names={};if(ids.length){const {data}=await sb.from('profiles').select('id,username').in('id',ids);(data||[]).forEach(p=>names[p.id]=p.username);}$('#rows').innerHTML=subs.map(s=>`<tr><td><img src="${esc(s.cloudinary_url)}"></td><td>${esc(names[s.user_id]||'Explorer')}</td><td>${esc(s.location_label||'—')}<br><small>${esc(s.caption||'')}</small></td><td>${s.captured_lat?`${Number(s.captured_lat).toFixed(4)}, ${Number(s.captured_lng).toFixed(4)}`:'—'}</td><td>${esc(s.status)}</td><td>${s.status==='pending'?`<button class="btn primary" data-a="${s.id}">Approve</button> <button class="btn secondary" data-r="${s.id}">Reject</button>`:'—'}</td></tr>`).join('');document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>moderate(b.dataset.a,'approved'));document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>moderate(b.dataset.r,'rejected'));}
async function moderate(id,status){const {error}=await sb.rpc('moderate_submission',{p_submission_id:id,p_status:status});if(error){alert(error.message);return;}await render();}
async function createMission(){const payload={title:$('#mt').value.trim(),description:$('#md').value.trim(),xp:Number($('#mx').value||100),division:$('#mdiv').value.trim(),district:$('#mdis').value.trim(),upazila:$('#mup').value.trim(),union_name:$('#mun').value.trim(),latitude:Number($('#mlat').value),longitude:Number($('#mlng').value),radius_m:Number($('#mrad').value||150),active:true};if(!payload.title){$('#createMsg').textContent='Title দিন।';return;}const {error}=await sb.from('missions').insert(payload);$('#createMsg').textContent=error?error.message:'Mission created ✅';if(!error)await render();}
start();
</script></body></html>
